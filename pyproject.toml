[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kir-auth"
version = "0.4.0"
description = "SDK cliente del KIR Platform Hub — identidad (oauth2-proxy) + ACL para mini-apps"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[tool.setuptools]
packages = ["kir_auth"]
